[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32 @ 7.0.1
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = +<*> -<sta_only.cpp> -<sta_mqtt_test.cpp>
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    ESP32Async/AsyncTCP @ ^3.5.0
    ESP32Async/ESPAsyncWebServer @ ^3.8.0
    h2zero/NimBLE-Arduino @ 2.5.0
    knolleary/PubSubClient @ ^2.8
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:sta_only]
extends = env:esp32-c3-devkitm-1
build_src_filter = +<sta_only.cpp>

[env:sta_mqtt_test]
extends = env:esp32-c3-devkitm-1
build_src_filter = +<sta_mqtt_test.cpp>

[env:esp32-s3-remote-gateway]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<s3_remote_gateway.cpp> +<ble_scanner.cpp> +<sensor_decoder.cpp>
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.0
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit NeoPixel @ ^1.12.5
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
