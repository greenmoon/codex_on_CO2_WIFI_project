<!doctype html>
<html lang="zh-Hant"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CO₂ Dashboard</title>
<style>
body{margin:0;background:#d9d5cc;color:#151515;font-family:system-ui;text-align:center}.meter{max-width:420px;margin:24px auto;padding:22px;border:10px solid #f6f5ef;border-radius:28px;background:#b8b3a8;box-shadow:0 4px 15px #777}.time{font:28px monospace;text-align:right}.rule{height:4px;background:#3d5548;margin:10px}.co2{font:92px monospace;line-height:1}.unit{font-size:18px}.row{display:flex;justify-content:space-around;font-size:30px}.label{font-size:13px}.status{margin-top:18px;font-size:14px}.received{font-size:13px;margin:8px 0}.qr{margin:18px auto 0;font-size:13px}.qr img{width:128px;height:128px;background:#fff;padding:8px;border-radius:8px}.led{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:6px;vertical-align:middle;background:#a22}.fresh{color:#176b3a}.fresh .led{background:#20c667;animation:breathe .6s ease-out}.stale{color:#966a00}.stale .led{background:#e8b20e;animation:breathe 1.8s infinite}.offline{color:#a22}.offline .led{background:#df3f3f;animation:blink .7s infinite}@keyframes breathe{0%{box-shadow:0 0 0 0 #20c667;opacity:.45}55%{box-shadow:0 0 16px 7px #20c667;opacity:1}100%{box-shadow:0 0 0 0 #20c667;opacity:.8}}@keyframes blink{50%{opacity:.2}}
</style>
<main class="meter"><div class="time" id="time">--:--</div><div class="rule"></div><div class="co2" id="co2">---</div><div class="unit">ppm CO₂</div><p id="age">等待 MQTT...</p><div class="row"><div><span id="temp">--</span>°C<div class="label">溫度</div></div><div><span id="hum">--</span>%<div class="label">濕度</div></div><div><span id="bat">--</span>%<div class="label">電量</div></div></div><div class="status offline" id="status">Bridge offline <span class="led"></span></div><div class="received" id="received">最後收到：--</div><div class="qr"><img src="/iphone_qr.png" alt="掃描開啟 CO₂ dashboard"><div>掃描 QR 開啟此 Dashboard</div></div></main>
<script>
const $=id=>document.getElementById(id);const format=d=>d.toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});function tick(){let d=new Date();$('time').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}setInterval(tick,1000);tick();
async function refresh(){try{let d=await (await fetch('/api/co2',{cache:'no-store'})).json();$('co2').textContent=d.co2_ppm??'---';$('temp').textContent=d.temperature_c??'--';$('hum').textContent=d.humidity_pct??'--';$('bat').textContent=d.battery_pct??'--';let age=d.received_ms?Date.now()-d.received_ms:null;$('age').textContent=age==null?'等待 MQTT...':Math.round(age/1000)+' seconds ago';$('received').textContent=age==null?'最後收到：--':'最後收到：'+format(new Date(d.received_ms));let cls=age==null?'offline':age>10000?'stale':'fresh';$('status').textContent=age==null?'Bridge connected, waiting payload ':age>10000?'MQTT payload stale ':'MQTT co2 connected ';$('status').className='status '+cls;$('status').append(Object.assign(document.createElement('span'),{className:'led'}));}catch(e){$('status').textContent='Bridge offline ';$('status').className='status offline';$('status').append(Object.assign(document.createElement('span'),{className:'led'}));$('received').textContent='最後收到：--';}}setInterval(refresh,2000);refresh();
</script>
