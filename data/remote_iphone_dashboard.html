<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#315847">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CO₂ Dashboard">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png?v=R1.3.11">
<link rel="manifest" href="../manifest.webmanifest?v=R1.3.11">
<title>CO₂ Remote WSS Dashboard R1.3.11</title>
<style>
:root{color-scheme:light;--bg:#e5e2d9;--screen:#bcb8ad;--ink:#121212;--green:#187548;--yellow:#946400;--red:#b42626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--ink);text-align:center}.meter{max-width:430px;margin:20px auto;padding:20px;border:10px solid #f8f7f1;border-radius:28px;background:var(--screen);box-shadow:0 5px 18px #0004}.top{font:25px ui-monospace,monospace;text-align:right}.rule{height:4px;background:#3e564a;margin:10px}.co2{font:88px ui-monospace,monospace;line-height:1}.unit{font-size:18px}.age{margin:12px 0}.row{display:flex;justify-content:space-around;font-size:29px}.label{font-size:13px}.status{font-weight:700;margin:18px 0 7px}.led{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:6px;vertical-align:middle}.green{color:var(--green)}.green .led{background:#21c66a;animation:flash .6s ease-out}.yellow{color:var(--yellow)}.yellow .led{background:#e5b41a;animation:pulse 1.8s infinite}.red{color:var(--red)}.red .led{background:#e33d3d;animation:blink .8s infinite}@keyframes flash{0%{box-shadow:0 0 0 0 #21c66a;opacity:.3}50%{box-shadow:0 0 18px 8px #21c66a;opacity:1}100%{box-shadow:0 0 0 0 #21c66a}}@keyframes pulse{50%{opacity:.3}}@keyframes blink{50%{opacity:.15}}details,.share,.voice-card{max-width:430px;margin:16px auto;text-align:left;padding:0 18px}input{width:100%;padding:9px;margin:5px 0;border:1px solid #9ca8a0;border-radius:6px;background:#fff}button,.open-link{width:100%;padding:11px;background:#185f9d;color:#fff;border:0;border-radius:8px;font-weight:700}.small{font-size:12px;color:#485458;word-break:break-all}.source{margin-top:8px}.share{padding:14px;text-align:center}.share h2,.voice-card h2{margin:0;font-size:17px}.qr{display:block;width:280px;height:280px;margin:14px auto;background:#fff;border-radius:10px;overflow:hidden}.qr img{display:block;width:100%;height:100%;image-rendering:pixelated}.open-link{display:block;text-decoration:none;margin:8px 0}.copy{background:#46515a;margin-top:8px}.voice-card{padding:16px;border:1px solid #c8c4ba;border-radius:16px;background:#f5f2ea}.voice-switch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 12px}.voice-switch button,.voice-current{padding:16px;line-height:1.2;touch-action:manipulation}.voice-switch button{min-height:78px;background:#6c7479;font-size:22px}.voice-on[aria-pressed="true"]{background:#187548}.voice-off[aria-pressed="true"]{background:#b42626}.voice-current{display:flex;min-height:210px;margin:0;background:#187548;flex-direction:column;align-items:stretch;justify-content:center;gap:12px;text-align:center}.voice-current-title{font-size:22px;font-weight:800}.voice-current-meta{display:flex;justify-content:space-between;font-size:14px}.voice-current .voice-state{margin:0;color:#e8fff1;font-size:14px;font-weight:600}.voice-current .voice-preview{min-height:52px;margin:0;padding:10px;border-radius:8px;background:#ffffff24;color:#fff;font-size:14px;font-weight:500;line-height:1.45;text-align:left}.versions{margin:28px auto 18px;padding:0 12px;color:#73736f;font-size:10px;line-height:1.5;letter-spacing:.02em;max-width:620px}
</style>
</head>
<body>
<main class="meter">
  <div class="top" id="clock">--:--</div><div class="rule"></div>
  <div class="co2" id="co2">---</div><div class="unit">ppm CO₂</div>
  <div class="age" id="age">等待指定 ESP32-S3...</div>
  <div class="row"><div><span id="temp">--</span>°C<div class="label">溫度</div></div><div><span id="hum">--</span>%<div class="label">濕度</div></div><div><span id="bat">--</span>%<div class="label">電量</div></div></div>
  <div class="status red" id="status">WSS disconnected <span class="led"></span></div>
  <div class="small" id="received">最後收到：--</div>
  <div class="small source" id="source">來源：--</div>
</main>
<section class="voice-card" aria-label="CO2 voice alert">
  <h2>🗣 CO₂ Voice Alert</h2>
  <div class="voice-switch" role="group" aria-label="Automatic voice alert">
    <button class="voice-on" id="voice-on" type="button" aria-pressed="true">ON</button>
    <button class="voice-off" id="voice-off" type="button" aria-pressed="false">OFF</button>
  </div>
  <button class="voice-current" id="voice-current" type="button" aria-label="Speak current CO2 level">
    <span class="voice-current-title">Voice Current CO₂ ppm</span>
    <span class="voice-current-meta"><span>Interval</span><strong id="voice-interval">30 / 10 sec</strong></span>
    <span class="voice-state" id="voice-state">Tap once to enable iPhone voice</span>
    <span class="voice-preview" id="voice-preview">「等待有效 CO₂ 資料。」</span>
  </button>
</section>
<section class="share" aria-label="分享 Dashboard">
  <h2>分享此 Dashboard</h2>
  <a class="qr" href="https://greenmoon.github.io/codex_on_CO2_WIFI_project/" aria-label="Open CO2 Dashboard"><img src="../offline_qr/global/iphone_dashboard.png?v=R1.3.11" width="360" height="360" alt="QR code for CO2 Global Dashboard"></a>
  <p class="small" id="share-url">https://greenmoon.github.io/codex_on_CO2_WIFI_project/</p>
  <a class="open-link" href="https://greenmoon.github.io/codex_on_CO2_WIFI_project/">Open Dashboard</a>
  <button class="copy" id="copy-url">Copy Dashboard URL</button>
</section>
<details><summary>WSS connection setting</summary>
  <label>Broker TLS domain<input id="host" value="jbnas03.synology.me" autocapitalize="off"></label>
  <label>WSS port<input id="port" value="8084" inputmode="numeric"></label>
  <label>WSS path<input id="path" value="/mqtt"></label>
  <label>固定 device_id<input id="device" value="co2s3-remote-14c19f508e10" readonly></label>
  <label>固定 topic<input id="topic" value="co2/co2s3-remote-14c19f508e10/telemetry" readonly></label>
  <button id="connect">Connect WSS MQTT</button>
  <p class="small" id="endpoint"></p>
</details>
<footer class="versions" id="versions">FW -- · Dashboard R1.3.11 · Payload Schema -- · MQTT/WSS R1</footer>
<script src="vendor/mqtt.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const DASHBOARD_VERSION='R1.3.11';
const SHARE_URL='https://greenmoon.github.io/codex_on_CO2_WIFI_project/';
const EXPECTED_DEVICE='co2s3-remote-14c19f508e10';
const TOPIC=`co2/${EXPECTED_DEVICE}/telemetry`;
const FRESH_MS=16000;
const VOICE_WARNING_INTERVAL_MS=30000;
const VOICE_DANGER_INTERVAL_MS=10000;
const VOICE_VOLUME=1.0;
const kDefaultWss={host:'jbnas03.synology.me',port:8084,path:'/mqtt'};
let client,lastReceived=0,lastSeq=null,lastUptime=null,lastCo2=null;
let voiceEnabled=localStorage.getItem('co2-voice-enabled')!=='false';
let voiceArmed=false,lastVoiceAt=Date.now(),voiceStaleAnnounced=false;
localStorage.removeItem('co2-voice-volume');
localStorage.removeItem('co2-voice-volume-r1.3.7-migrated');

function clock(){$('clock').textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});}setInterval(clock,1000);clock();
$('copy-url').onclick=async()=>{try{await navigator.clipboard.writeText(SHARE_URL);$('copy-url').textContent='Copied';setTimeout(()=>$('copy-url').textContent='Copy Dashboard URL',1200);}catch(_){$('copy-url').textContent='Copy failed';}};
function state(kind,text){$('status').className='status '+kind;$('status').textContent=text+' ';$('status').append(Object.assign(document.createElement('span'),{className:'led'}));}
function clearReading(){lastReceived=0;lastSeq=null;lastUptime=null;lastCo2=null;$('co2').textContent='---';$('temp').textContent='--';$('hum').textContent='--';$('bat').textContent='--';$('age').textContent='等待指定 ESP32-S3...';$('received').textContent='最後收到：--';$('source').textContent='來源：--';$('versions').textContent=`FW -- · Dashboard ${DASHBOARD_VERSION} · Payload Schema -- · MQTT/WSS R1`;}
function voiceMessage(ppm){const value=Math.round(ppm);if(value<800)return `目前二氧化碳濃度 ${value} PPM，狀態正常。`;if(value<1000)return `目前二氧化碳濃度 ${value} PPM，警告，建議通風。`;if(value<2000)return `二氧化碳濃度 ${value} PPM，高度警告，請加強通風。`;if(value<3000)return `二氧化碳濃度 ${value} PPM，危險，請立即通風。`;return `嚴重警告，二氧化碳濃度 ${value} PPM，請立即離開並通風。`;}
function currentVoiceMessage(){return lastCo2!==null&&lastReceived>0&&Date.now()-lastReceived<=FRESH_MS?voiceMessage(lastCo2):'目前尚未收到有效的二氧化碳資料。';}
function voiceIntervalMs(ppm){if(ppm<800)return 0;if(ppm<2000)return VOICE_WARNING_INTERVAL_MS;return VOICE_DANGER_INTERVAL_MS;}
function zhVoice(){const voices=window.speechSynthesis?.getVoices?.()||[];return voices.find(v=>v.lang.toLowerCase()==='zh-tw')||voices.find(v=>v.lang.toLowerCase().startsWith('zh'))||null;}
function speakText(text){if(!voiceEnabled||!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window))return false;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-TW';utterance.rate=0.9;utterance.pitch=1;utterance.volume=VOICE_VOLUME;const voice=zhVoice();if(voice)utterance.voice=voice;utterance.onstart=()=>{voiceArmed=true;renderVoiceCard();};utterance.onend=renderVoiceCard;utterance.onerror=()=>{$('voice-state').textContent='Voice unavailable; tap Voice Current CO₂ ppm';};window.speechSynthesis.speak(utterance);return true;}
function renderVoiceCard(){const supported='speechSynthesis'in window&&'SpeechSynthesisUtterance'in window;const interval=lastCo2==null?null:voiceIntervalMs(lastCo2);$('voice-on').setAttribute('aria-pressed',String(voiceEnabled));$('voice-off').setAttribute('aria-pressed',String(!voiceEnabled));$('voice-interval').textContent=interval==null?'30 / 10 sec':interval===0?'Silent':interval/1000+' sec';$('voice-preview').textContent=lastCo2==null?'「等待有效 CO₂ 資料。」':'「'+voiceMessage(lastCo2)+'」';if(!supported)$('voice-state').textContent='Voice unavailable';else if(!voiceEnabled)$('voice-state').textContent='Voice disabled';else if(!voiceArmed)$('voice-state').textContent='Tap ON or Voice Current CO₂ ppm to enable iPhone voice';else if(lastCo2==null)$('voice-state').textContent='Voice ready; waiting fresh CO₂ data';else if(Date.now()-lastReceived>FRESH_MS)$('voice-state').textContent='Voice paused: stale payload';else if(interval===0)$('voice-state').textContent='Normal range: voice silent';else if(window.speechSynthesis.speaking)$('voice-state').textContent='Speaking now';else $('voice-state').textContent='Voice ready; next announcement: '+Math.max(0,Math.ceil((interval-(Date.now()-lastVoiceAt))/1000))+' sec';}
function primeVoiceFromGesture(){if(!voiceEnabled||voiceArmed)return;voiceArmed=true;lastVoiceAt=Date.now();speakText('二氧化碳語音警報已啟用。');renderVoiceCard();}
function armVoiceFromGesture(event){if(event.target.closest?.('button'))return;primeVoiceFromGesture();}
document.addEventListener('pointerdown',armVoiceFromGesture,{passive:true});
document.addEventListener('touchstart',armVoiceFromGesture,{passive:true});
$('voice-on').onclick=()=>{voiceEnabled=true;voiceArmed=true;localStorage.setItem('co2-voice-enabled','true');lastVoiceAt=Date.now();speakText('二氧化碳語音警報已啟用。'+currentVoiceMessage());renderVoiceCard();};
$('voice-off').onclick=()=>{voiceEnabled=false;window.speechSynthesis?.cancel();localStorage.setItem('co2-voice-enabled','false');renderVoiceCard();};
$('voice-current').onclick=()=>{voiceEnabled=true;voiceArmed=true;localStorage.setItem('co2-voice-enabled','true');lastVoiceAt=Date.now();speakText(currentVoiceMessage());renderVoiceCard();};
function serviceVoice(){renderVoiceCard();if(!voiceEnabled||!voiceArmed||lastCo2==null)return;const age=Date.now()-lastReceived;if(age>FRESH_MS){if(!voiceStaleAnnounced){voiceStaleAnnounced=true;lastVoiceAt=Date.now();speakText('二氧化碳感測資料中斷。');}return;}const interval=voiceIntervalMs(lastCo2);if(interval===0){lastVoiceAt=Date.now();return;}if(Date.now()-lastVoiceAt>=interval&&!window.speechSynthesis.speaking){lastVoiceAt=Date.now();speakText(voiceMessage(lastCo2));}}
setInterval(serviceVoice,1000);renderVoiceCard();
function validPayload(d,packet){const co2=Number(d.co2_ppm),seq=Number(d.seq),uptime=Number(d.uptime_ms),age=Number(d.sensor_age_ms);if(packet?.retain)return false;if(d.device_id!==EXPECTED_DEVICE||d.sensor_data_valid!==true||Number(d.schema)!==2)return false;if(!Number.isFinite(co2)||co2<250||co2>10000||!Number.isFinite(seq)||!Number.isFinite(uptime)||!Number.isFinite(age)||age>15000)return false;const rebooted=lastUptime!==null&&uptime<lastUptime;if(!rebooted&&lastSeq!==null&&seq<=lastSeq)return false;return true;}
function acceptPayload(d){const recovered=voiceStaleAnnounced;lastReceived=Date.now();lastSeq=Number(d.seq);lastUptime=Number(d.uptime_ms);lastCo2=Number(d.co2_ppm);$('co2').textContent=Math.round(lastCo2);$('temp').textContent=Number(d.temperature_c).toFixed(1);$('hum').textContent=Math.round(Number(d.humidity_pct));$('bat').textContent=Math.round(Number(d.battery_pct));$('received').textContent='最後收到：'+new Date(lastReceived).toLocaleString('zh-TW',{hour12:false});$('source').textContent=`來源：${d.device_id} · seq ${lastSeq}`;$('versions').textContent=`FW ${d.firmware_version||'--'} · Dashboard ${DASHBOARD_VERSION} · Payload Schema ${d.schema} · MQTT/WSS R1`;state('green','MQTT S3 telemetry connected');if(recovered&&voiceEnabled&&voiceArmed){voiceStaleAnnounced=false;lastVoiceAt=Date.now();speakText('二氧化碳感測資料已恢復。');}renderVoiceCard();}
function connect(){if(client)client.end(true);clearReading();const rawHost=$('host').value.trim(),host=rawHost==='59.124.7.98'?kDefaultWss.host:rawHost,port=Number($('port').value),path=$('path').value.trim()||'/mqtt';if(host!==rawHost)$('host').value=host;const url=`wss://${host}:${port}${path}`;$('endpoint').textContent=url+'  topic: '+TOPIC;localStorage.setItem('co2-wss-config',JSON.stringify({host,port,path}));if(typeof mqtt==='undefined'){state('red','MQTT library unavailable');return;}state('yellow','WSS connecting');client=mqtt.connect(url,{clientId:'iphone-co2-'+Math.random().toString(16).slice(2),clean:true,reconnectPeriod:2000,connectTimeout:8000});client.on('connect',()=>{client.subscribe(TOPIC,{qos:0},err=>state(err?'red':'yellow',err?'Subscribe failed':'WSS subscribed; waiting S3'));});client.on('message',(topic,bytes,packet)=>{try{const d=JSON.parse(bytes.toString());if(topic!==TOPIC||!validPayload(d,packet))return;acceptPayload(d);}catch(_){state('red','Invalid JSON payload');}});client.on('error',()=>state('red','WSS connection error'));client.on('offline',()=>state('red','WSS offline'));client.on('close',()=>state('red','WSS disconnected'));}
setInterval(()=>{const age=lastReceived?Date.now()-lastReceived:null;$('age').textContent=age==null?'等待指定 ESP32-S3...':Math.round(age/1000)+' seconds ago';if(age!==null&&age>FRESH_MS&&client?.connected)state('yellow','S3 payload stale');},1000);
try{const c=JSON.parse(localStorage.getItem('co2-wss-config'));if(c){if(c.host==='59.124.7.98')c.host=kDefaultWss.host;$('host').value=c.host||kDefaultWss.host;$('port').value=c.port||kDefaultWss.port;$('path').value=c.path||kDefaultWss.path;}}catch(_){}$('device').value=EXPECTED_DEVICE;$('topic').value=TOPIC;$('connect').onclick=connect;connect();
</script>
</body>
</html>
