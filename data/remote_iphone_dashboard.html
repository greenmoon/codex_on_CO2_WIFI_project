<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CO₂ Remote WSS Dashboard R1.2.1</title>
<style>
:root{color-scheme:light;--bg:#e5e2d9;--screen:#bcb8ad;--ink:#121212;--green:#187548;--yellow:#a06c00;--red:#b42626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--ink);text-align:center}.meter{max-width:430px;margin:20px auto;padding:20px;border:10px solid #f8f7f1;border-radius:28px;background:var(--screen);box-shadow:0 5px 18px #0004}.top{font:25px ui-monospace,monospace;text-align:right}.rule{height:4px;background:#3e564a;margin:10px}.co2{font:88px ui-monospace,monospace;line-height:1}.unit{font-size:18px}.age{margin:12px 0}.row{display:flex;justify-content:space-around;font-size:29px}.label{font-size:13px}.status{font-weight:700;margin:18px 0 7px}.led{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:6px;vertical-align:middle}.green{color:var(--green)}.green .led{background:#21c66a;animation:flash .6s ease-out}.yellow{color:var(--yellow)}.yellow .led{background:#e5b41a;animation:pulse 1.8s infinite}.red{color:var(--red)}.red .led{background:#e33d3d;animation:blink .8s infinite}@keyframes flash{0%{box-shadow:0 0 0 0 #21c66a;opacity:.3}50%{box-shadow:0 0 18px 8px #21c66a;opacity:1}100%{box-shadow:0 0 0 0 #21c66a}}@keyframes pulse{50%{opacity:.3}}@keyframes blink{50%{opacity:.15}}details,.share{max-width:430px;margin:16px auto;text-align:left;padding:0 18px}input{width:100%;padding:9px;margin:5px 0;border:1px solid #9ca8a0;border-radius:6px}button{width:100%;padding:10px;background:#185f9d;color:#fff;border:0;border-radius:6px;font-weight:700}.small{font-size:12px;color:#485458;word-break:break-all}.share{padding:14px;text-align:center}.share h2{margin:0;font-size:17px}.qr{width:180px;height:180px;margin:12px auto;background:#fff;padding:8px;border-radius:10px}.qr img{display:block;margin:auto;max-width:100%;height:auto}.copy{background:#46515a;margin-top:8px}
</style>
<main class="meter">
  <div class="top" id="clock">--:--</div><div class="rule"></div>
  <div class="co2" id="co2">---</div><div class="unit">ppm CO₂</div>
  <div class="age" id="age">等待 WSS MQTT...</div>
  <div class="row"><div><span id="temp">--</span>°C<div class="label">溫度</div></div><div><span id="hum">--</span>%<div class="label">濕度</div></div><div><span id="bat">--</span>%<div class="label">電量</div></div></div>
  <div class="status red" id="status">WSS disconnected <span class="led"></span></div>
  <div class="small" id="received">最後收到：--</div>
</main>
<section class="share" aria-label="分享 Dashboard">
  <h2>分享此 Dashboard</h2>
  <div class="qr" id="share-qr" aria-label="Dashboard QR code"></div>
  <p class="small" id="share-url">--</p>
  <button class="copy" id="copy-url">Copy Dashboard URL</button>
</section>
<details><summary>WSS connection setting</summary>
  <label>Broker TLS domain（正式使用 domain，不建議裸 IP）<input id="host" value="jbnas03.synology.me" autocapitalize="off"></label>
  <label>WSS port<input id="port" value="8084" inputmode="numeric"></label>
  <label>WSS path<input id="path" value="/mqtt"></label>
  <label>只顯示 device_id（空白＝接受全部）<input id="device" placeholder="co2s3-remote-..."></label>
  <button id="connect">Connect WSS MQTT</button>
  <p class="small" id="endpoint"></p>
</details>
<script src="vendor/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);const kDefaultWss={host:'jbnas03.synology.me',port:8084,path:'/mqtt'};let client,lastReceived=0;function clock(){$('clock').textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});}setInterval(clock,1000);clock();
function setupShareQr(){const url=location.href.split('#')[0];$('share-url').textContent=url;const qr=$('share-qr');qr.replaceChildren();if(window.QRCode)new QRCode(qr,{text:url,width:164,height:164,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else qr.textContent='QR library unavailable';}$('copy-url').onclick=async()=>{try{await navigator.clipboard.writeText(location.href.split('#')[0]);$('copy-url').textContent='Copied';setTimeout(()=>$('copy-url').textContent='Copy Dashboard URL',1200);}catch(_){$('copy-url').textContent='Copy failed';}};setupShareQr();
function state(kind,text){$('status').className='status '+kind;$('status').textContent=text+' ';$('status').append(Object.assign(document.createElement('span'),{className:'led'}));}
function connect(){if(client)client.end(true);const rawHost=$('host').value.trim(),host=rawHost==='59.124.7.98'?kDefaultWss.host:rawHost,port=Number($('port').value),path=$('path').value.trim()||'/mqtt',device=$('device').value.trim();if(host!==rawHost)$('host').value=host;const url=`wss://${host}:${port}${path}`;$('endpoint').textContent=url+'  topic: co2';localStorage.setItem('co2-wss-config',JSON.stringify({host,port,path,device}));if(typeof mqtt==='undefined'){state('red','MQTT library unavailable');return;}state('yellow','WSS connecting');client=mqtt.connect(url,{clientId:'iphone-co2-'+Math.random().toString(16).slice(2),clean:true,reconnectPeriod:2000,connectTimeout:8000});client.on('connect',()=>{client.subscribe('co2',{qos:0},err=>state(err?'red':'yellow',err?'Subscribe failed':'WSS subscribed; waiting payload'));});client.on('message',(topic,bytes)=>{try{const d=JSON.parse(bytes.toString());if(device&&d.device_id!==device)return;$('co2').textContent=d.co2_ppm??'---';$('temp').textContent=d.temperature_c??'--';$('hum').textContent=d.humidity_pct??'--';$('bat').textContent=d.battery_pct??'--';lastReceived=Date.now();$('received').textContent='最後收到：'+new Date(lastReceived).toLocaleString('zh-TW',{hour12:false});state('green','MQTT co2 connected');}catch(e){state('red','Invalid JSON payload');}});client.on('error',()=>state('red','WSS connection error'));client.on('offline',()=>state('red','WSS offline'));client.on('close',()=>state('red','WSS disconnected'));}
setInterval(()=>{$('age').textContent=lastReceived?Math.round((Date.now()-lastReceived)/1000)+' seconds ago':'等待 WSS MQTT...';if(lastReceived&&Date.now()-lastReceived>10000&&client?.connected)state('yellow','MQTT payload stale');},1000);try{const c=JSON.parse(localStorage.getItem('co2-wss-config'));if(c){if(c.host==='59.124.7.98')c.host=kDefaultWss.host;$('host').value=c.host||kDefaultWss.host;$('port').value=c.port||kDefaultWss.port;$('path').value=c.path||kDefaultWss.path;$('device').value=c.device||'';}}catch(_){}$('connect').onclick=connect;connect();
</script>
</html>
